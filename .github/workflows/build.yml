name: build
run-name: Kanga boot diagnostics validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none
          components: rust-src, rustfmt
      - name: Install image and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential xorriso qemu-system-x86
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build bootable image
        run: sh scripts/build-iso.sh
      - name: Boot Kanga in QEMU
        run: |
          set +e
          timeout 15s qemu-system-x86_64 \
            -machine q35 -m 256M -boot d -cdrom build/kanga.iso \
            -serial file:build/serial.log -display none -no-reboot -no-shutdown
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          if [ -f build/serial.log ]; then
            cat build/serial.log
          fi
          grep -F "Kanga kernel entry reached" build/serial.log
          grep -F "Memory map entries:" build/serial.log
          grep -F "Physical frame allocator: allocated frame at" build/serial.log
          grep -F "Allocated frame virtual address:" build/serial.log
          grep -F "Frame memory test: passed" build/serial.log
