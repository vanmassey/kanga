name: build
run-name: Kanga boot diagnostics validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none
          components: rust-src, rustfmt
      - name: Install image and emulator tools
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential xorriso qemu-system-x86 socat
      - name: Check shell scripts
        run: sh -n scripts/build-iso.sh scripts/check.sh scripts/run-qemu.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build bootable image
        run: sh scripts/build-iso.sh
      - name: Boot Kanga and test keyboard IRQ in QEMU
        run: |
          set -eu
          rm -f build/serial.log build/qemu-monitor.sock build/kanga-screen.ppm build/kanga-help-screen.ppm
          qemu-system-x86_64 \
            -machine pc -m 256M -boot d -cdrom build/kanga.iso \
            -serial file:build/serial.log \
            -monitor unix:build/qemu-monitor.sock,server,nowait \
            -display none -no-reboot -no-shutdown &
          qemu_pid=$!
          cleanup() {
            status=$?
            # Preserve the first screenshot if the normal test path already
            # captured it. Otherwise, take a best-effort screenshot before
            # stopping QEMU so failures still leave diagnostic evidence.
            if [ ! -s build/kanga-screen.ppm ] && kill -0 "$qemu_pid" 2>/dev/null; then
              if [ -S build/qemu-monitor.sock ]; then
                printf 'screendump build/kanga-screen.ppm\n' |
                  socat -T1 - UNIX-CONNECT:build/qemu-monitor.sock >/dev/null 2>&1 || true
              fi
            fi
            kill "$qemu_pid" 2>/dev/null || true
            wait "$qemu_pid" 2>/dev/null || true
            return "$status"
          }
          trap cleanup EXIT

          for attempt in $(seq 1 100); do
            if grep -Fq "Kanga> " build/serial.log 2>/dev/null; then
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              cat build/serial.log || true
              exit 1
            fi
            sleep 0.1
          done
          grep -F "Kanga> " build/serial.log
          sleep 1
          printf 'screendump build/kanga-colour-screen.ppm\n' |
            socat -T1 - UNIX-CONNECT:build/qemu-monitor.sock >/dev/null

          # Exercise the multi-line HELP output before later commands scroll it away.
          for key in h e l p ret; do
            printf 'sendkey %s 80\n' "$key" | socat -T1 - UNIX-CONNECT:build/qemu-monitor.sock >/dev/null
            sleep 0.15
          done
          sleep 0.5
          printf 'screendump build/kanga-help-screen.ppm\n' |
            socat -T1 - UNIX-CONNECT:build/qemu-monitor.sock >/dev/null

          for key in d i r ret v e r ret e c h o spc h e l l o spc k a n g a ret t i m e ret d a t e ret u p t i m e ret w r i t e spc n o t e dot t x t spc h e l l o spc f r o m spc k a n g a ret t y p e spc n o t e dot t x t ret d i r ret d e l spc n o t e dot t x t ret d i r ret; do
            printf 'sendkey %s 80\n' "$key" | socat -T1 - UNIX-CONNECT:build/qemu-monitor.sock >/dev/null
            sleep 0.15
          done
          sleep 1
          for key in a b o u t ret c a l ret; do
            printf 'sendkey %s 80\n' "$key" | socat -T1 - UNIX-CONNECT:build/qemu-monitor.sock >/dev/null
            sleep 0.15
          done
          sleep 0.5
          printf 'screendump build/kanga-screen.ppm\n' | socat -T1 - UNIX-CONNECT:build/qemu-monitor.sock >/dev/null
          sleep 0.2
          cat build/serial.log
          grep -F "Kanga kernel entry reached" build/serial.log
          grep -F "Interrupts: 256-entry IDT installed" build/serial.log
          grep -F "Interrupts: CPU exception gates 0-31 configured" build/serial.log
          grep -F "Interrupts: PIC remapped; timer IRQ0 and keyboard IRQ1 unmasked" build/serial.log
          grep -F "Timer: PIT configured at 100 Hz" build/serial.log
          grep -F "Interrupts: keyboard IRQ1 enabled" build/serial.log
          grep -F "Memory map entries:" build/serial.log
          grep -F "Physical bitmap allocator: " build/serial.log
grep -F "Physical bitmap capacity: " build/serial.log
grep -F "Physical frame allocator: allocated frame at" build/serial.log
          grep -F "Frame allocation uniqueness test: passed" build/serial.log
          grep -F "Frame deallocation, double-free guard and reuse test: passed" build/serial.log
grep -F "Bitmap contiguous allocation test: passed" build/serial.log
          grep -F "Frame allocator integrity test: passed" build/serial.log
          grep -F "Allocated frame virtual address:" build/serial.log
          grep -F "Frame memory test: passed" build/serial.log
          grep -F "Display: ANSI colour framebuffer text console" build/serial.log
          grep -F "Display: framebuffer text console ready" build/serial.log
          grep -F "Initialising keyboard...... " build/serial.log
          grep -F "Starting command shell..... " build/serial.log
          grep -F "Type HELP for a list of commands." build/serial.log
          grep -F "Kanga OS 0.1.0" build/serial.log
          grep -F "Kanga DOS-style command shell" build/serial.log
          grep -F "KangaFS RAM filesystem..... " build/serial.log
          grep -F "Saved note.txt (16 bytes)." build/serial.log
          grep -F "hello from kanga" build/serial.log
          grep -F "Deleted note.txt." build/serial.log
          ! grep -F "PC speaker" build/serial.log
          test -s build/kanga-screen.ppm
          test -s build/kanga-help-screen.ppm
          python3 scripts/check-framebuffer.py build/kanga-screen.ppm
          python3 scripts/check-framebuffer.py build/kanga-help-screen.ppm
          python3 scripts/check-framebuffer.py build/kanga-colour-screen.ppm --expect-ansi
      - name: Upload QEMU screenshot, bootable ISO and serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanga-iso-and-boot-log
          path: |
            build/kanga.iso
            build/serial.log
            build/kanga-screen.ppm
            build/kanga-help-screen.ppm
            build/kanga-colour-screen.ppm
          if-no-files-found: warn
          retention-days: 7
