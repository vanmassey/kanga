name: build
run-name: Kanga boot diagnostics validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none
          components: rust-src, rustfmt
      - name: Install image and emulator tools
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential xorriso qemu-system-x86
      - name: Check shell scripts
        run: sh -n scripts/build-iso.sh scripts/check.sh scripts/run-qemu.sh
      - name: Test host-side utilities
        run: python3 -m unittest discover -s tests -v
      - name: Format Rust code
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build bootable image
        run: sh scripts/build-iso.sh
      - name: Boot Kanga kernel in QEMU
        run: |
          set -eu
          rm -f build/serial.log
          qemu-system-x86_64 \
            -machine pc -cpu max -m 256M -boot d -cdrom build/kanga.iso \
            -serial file:build/serial.log \
            -display none -no-reboot -no-shutdown &
          qemu_pid=$!
          cleanup() {
            status=$?
            kill "$qemu_pid" 2>/dev/null || true
            wait "$qemu_pid" 2>/dev/null || true
            return "$status"
          }
          trap cleanup EXIT

          for attempt in $(seq 1 100); do
            if grep -Fq "Scheduler runtime test: passed" build/serial.log 2>/dev/null; then
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              cat build/serial.log || true
              exit 1
            fi
            sleep 0.1
          done
          grep -F "Kernel idle loop reached" build/serial.log
          grep -F "Scheduler runtime test: passed (timer pre-emption and both workers observed)" build/serial.log
          sleep 1
          cat build/serial.log

          ! grep -F "paging: 1GiB pages are not supported" build/serial.log
          grep -F "Kanga kernel entry reached" build/serial.log
          grep -F "Interrupts: 256-entry IDT installed" build/serial.log
          grep -F "Interrupts: CPU exception gates 0-31 configured" build/serial.log
          grep -F "Interrupts: PIC remapped; timer IRQ0 and keyboard IRQ1 enabled, other legacy IRQs masked" build/serial.log
          grep -F "Timer: PIT configured at 100 Hz" build/serial.log
          grep -F "Scheduler: pre-emptive round-robin enabled (3 kernel threads)" build/serial.log
          grep -F "Memory map entries:" build/serial.log
          grep -F "Physical bitmap allocator: " build/serial.log
          grep -F "Virtual memory manager: x86-64 four-level page tables ready" build/serial.log
          grep -F "Virtual mapping, translation and unmapping test: passed" build/serial.log
          grep -F "Physical bitmap managed frames: " build/serial.log
          grep -F "Physical bitmap capacity: " build/serial.log
          grep -F "Physical frame allocator: allocated frame at" build/serial.log
          grep -F "Frame allocation uniqueness test: passed" build/serial.log
          grep -F "Frame deallocation, double-free guard and reuse test: passed" build/serial.log
          grep -F "Bitmap contiguous allocation test: passed" build/serial.log
          grep -F "Frame allocator integrity test: passed" build/serial.log
          grep -F "Allocated frame virtual address:" build/serial.log
          grep -F "Frame memory test: passed" build/serial.log
          grep -F "Kernel heap initialisation: passed" build/serial.log
          grep -F "Kernel heap allocation and reclamation test: passed" build/serial.log
          grep -F "Kernel initialisation complete" build/serial.log
          ! grep -F "Kanga> " build/serial.log
          grep -F "Kanga framebuffer console ready" build/serial.log
      - name: Upload bootable ISO and serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanga-iso-and-boot-log
          path: |
            build/kanga.iso
            build/serial.log
          if-no-files-found: warn
          retention-days: 7
